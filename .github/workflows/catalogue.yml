name: Validate public catalogue
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/catalogue.test.mjs
      - run: node scripts/catalogue.mjs generate --check
      - run: node scripts/validate-public.mjs
