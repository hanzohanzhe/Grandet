name: Validate public catalogue and Skill
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 tests/installation-receipts.test.py
      - run: python3 tests/packaged-receipts.test.py
      - run: python3 tests/latest-pointer.test.py
      - run: node --test tests/*.test.mjs
      - run: node scripts/catalogue.mjs generate --check
      - run: node scripts/validate-public.mjs
      # grandet.ai must be able to follow downloads/latest.json; see docs/skills/site-follow.md.
      - run: node scripts/check-site-follow.mjs --previous-ref HEAD^
