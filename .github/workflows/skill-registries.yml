name: Publish Skill to ClawHub and SkillHub
# A published skill-v* release uploads the same Skill folder to ClawHub and Tencent SkillHub.
# See docs/skills/registries.md for the two secrets and what each registry does with an upload.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. skill-v0.3.0-build.20261016c
        required: true
        type: string
      dry_run:
        description: Check only, publish nothing
        required: false
        type: boolean
        default: true
      targets:
        description: Registries to process
        required: false
        type: choice
        options: [both, clawhub, skillhub]
        default: both
      clawhub_revision:
        description: ClawHub only. Republish this build to ClawHub as <version>.N, because ClawHub never replaces a version (needs targets=clawhub)
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: skill-registries
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  CLAWHUB_CLI: clawhub@0.23.3
  SKILLHUB_KIT_URL: https://skillhub-1388575217.cos.ap-guangzhou.myqcloud.com/install/latest.tar.gz
  SKILLHUB_HOST: https://api.skillhub.cn
jobs:
  stage:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'skill-v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.input.outputs.tag }}
      dry_run: ${{ steps.input.outputs.dry_run }}
      targets: ${{ steps.input.outputs.targets }}
      required: ${{ steps.input.outputs.required }}
      version: ${{ steps.stage.outputs.version }}
      changelog: ${{ steps.stage.outputs.changelog }}
      clawhub_version: ${{ steps.stage.outputs.clawhub_version }}
      clawhub_changelog: ${{ steps.stage.outputs.clawhub_changelog }}
    steps:
      - id: input
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_TARGETS: ${{ inputs.targets }}
          INPUT_CLAWHUB_REVISION: ${{ inputs.clawhub_revision }}
        run: |
          if [[ "$EVENT" == release ]]; then
            tag="$RELEASE_TAG"; dry=false; targets=both; required=false; revision=
          else
            tag="$INPUT_TAG"; dry="$INPUT_DRY_RUN"; targets="$INPUT_TARGETS"; required=true; revision="$INPUT_CLAWHUB_REVISION"
          fi
          if [[ ! "$tag" =~ ^skill-v[0-9]+\.[0-9]+\.[0-9]+-build\.[0-9]{8}[a-z]?$ ]]; then
            echo "::error::Not a Skill build tag: $tag"; exit 1
          fi
          # A revision only republishes an existing build to ClawHub; SkillHub already has that build's version.
          if [[ -n "$revision" && "$targets" != clawhub ]]; then
            echo "::error::clawhub_revision republishes a build to ClawHub only; set targets=clawhub."; exit 1
          fi
          { echo "tag=$tag"; echo "dry_run=$dry"; echo "targets=$targets"; echo "required=$required"; echo "clawhub_revision=$revision"; } >> "$GITHUB_OUTPUT"
      # The staging script comes from this workflow's commit; the Skill comes from the release tag,
      # so releases tagged before this workflow existed can still be published by hand.
      - uses: actions/checkout@v4
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.input.outputs.tag }}
          path: release
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: stage
        env:
          TAG: ${{ steps.input.outputs.tag }}
          CLAWHUB_REVISION: ${{ steps.input.outputs.clawhub_revision }}
        run: |
          revision=()
          if [[ -n "$CLAWHUB_REVISION" ]]; then revision=(--clawhub-revision "$CLAWHUB_REVISION"); fi
          node tools/scripts/stage-registry-skill.mjs --root release --tag "$TAG" --out "$RUNNER_TEMP/registry" "${revision[@]}" > "$RUNNER_TEMP/stage.json"
          cp "$RUNNER_TEMP/stage.json" "$RUNNER_TEMP/registry/stage.json"
          echo "version=$(jq -r .registryVersion "$RUNNER_TEMP/stage.json")" >> "$GITHUB_OUTPUT"
          echo "changelog=$(jq -r .changelog "$RUNNER_TEMP/stage.json")" >> "$GITHUB_OUTPUT"
          echo "clawhub_version=$(jq -r .clawhub.version "$RUNNER_TEMP/stage.json")" >> "$GITHUB_OUTPUT"
          echo "clawhub_changelog=$(jq -r .clawhub.changelog "$RUNNER_TEMP/stage.json")" >> "$GITHUB_OUTPUT"
          jq '{tag, build, registryVersion, clawhubVersion: .clawhub.version, archive, chinaDownload}' "$RUNNER_TEMP/stage.json"
          { echo "### Staged kit"; echo "Mainland China download once SkillHub approves it: $(jq -r .chinaDownload "$RUNNER_TEMP/stage.json")"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: registry-stage
          path: ${{ runner.temp }}/registry
          if-no-files-found: error
          retention-days: 30

  clawhub:
    needs: stage
    if: needs.stage.outputs.targets != 'skillhub'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: registry-stage
          path: ${{ runner.temp }}/registry
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          DRY_RUN: ${{ needs.stage.outputs.dry_run }}
          REQUIRED: ${{ needs.stage.outputs.required }}
          VERSION: ${{ needs.stage.outputs.clawhub_version }}
          CHANGELOG: ${{ needs.stage.outputs.clawhub_changelog }}
          CLAWHUB_OWNER: hanzohanzhe
        run: |
          dir="$RUNNER_TEMP/registry/clawhub/grandet-api-price-finder"
          stage="$RUNNER_TEMP/registry/stage.json"
          slug="$(jq -r .slug "$stage")"
          result="$RUNNER_TEMP/clawhub-result.json"
          errors="$RUNNER_TEMP/clawhub-errors.txt"
          flags=()
          if [[ "$DRY_RUN" == true ]]; then
            flags+=(--dry-run)
          elif [[ -z "$CLAWHUB_TOKEN" ]]; then
            if [[ "$REQUIRED" == true ]]; then echo "::error::CLAWHUB_TOKEN secret is not set."; exit 1; fi
            echo "::warning::CLAWHUB_TOKEN secret is not set; ClawHub was skipped for this release."; exit 0
          else
            export CLAWHUB_CONFIG_PATH="$RUNNER_TEMP/clawhub-config.json"
            umask 077
            jq -n --arg token "$CLAWHUB_TOKEN" '{registry: "https://clawhub.ai", token: $token}' > "$CLAWHUB_CONFIG_PATH"
          fi
          status=0
          npx --yes "$CLAWHUB_CLI" skill publish "$dir" \
            --slug "$slug" \
            --name "$(jq -r .clawhub.name "$stage")" \
            --version "$VERSION" \
            --changelog "$CHANGELOG" \
            --categories "$(jq -r .clawhub.categories "$stage")" \
            --topics "$(jq -r .clawhub.topics "$stage")" \
            --no-input --json "${flags[@]}" > "$result" 2> "$errors" || status=$?
          cat "$result"
          cat "$errors" >&2
          if (( status != 0 )); then
            # The CLI retries rate-limited requests. When a retry repeats an upload that already went through, ClawHub
            # answers "Version ... already exists". Accept that only if ClawHub serves exactly this version, with the
            # staged files, under our account. Any other failure still fails the job.
            if [[ "$DRY_RUN" == true ]] || ! grep -qF "Error: Version $VERSION already exists." "$errors"; then exit "$status"; fi
            api="https://clawhub.ai/api/v1/skills/$slug"
            existing="$RUNNER_TEMP/clawhub-existing.json"
            # A new version returns 404 here until ClawHub's security checks publish it, which takes several minutes.
            for attempt in $(seq 1 40); do
              code="$(curl -sS --max-time 30 -o "$existing" -w '%{http_code}' "$api/versions/$VERSION?ownerHandle=$CLAWHUB_OWNER" || true)"
              if [[ "$code" == 200 ]]; then break; fi
              if [[ ! "$code" =~ ^(000|404|429|5[0-9][0-9])$ ]]; then
                echo "::error::ClawHub returned HTTP $code for $slug@$VERSION: $(head -c 300 "$existing" 2>/dev/null)"; exit 1
              fi
              echo "ClawHub: $slug@$VERSION is not public yet (HTTP $code, attempt $attempt/40)."
              sleep 30
            done
            if [[ "$code" != 200 ]]; then
              echo "::error::ClawHub says $VERSION already exists, but it is still not public under @$CLAWHUB_OWNER after 20 minutes."; exit 1
            fi
            jq -e --arg slug "$slug" --arg version "$VERSION" '.skill.slug == $slug and .version.version == $version' "$existing" > /dev/null \
              || { echo "::error::ClawHub answered with another skill or version than $slug@$VERSION."; exit 1; }
            curl -fsS --retry 5 --max-time 30 "$api?ownerHandle=$CLAWHUB_OWNER" | jq -e --arg owner "$CLAWHUB_OWNER" '.owner.handle == $owner' > /dev/null \
              || { echo "::error::$slug on ClawHub is not owned by @$CLAWHUB_OWNER."; exit 1; }
            # ClawHub adds a generated skill-card.md; every other file must match the staged folder byte for byte.
            jq -r '.version.files[] | select(.path | ascii_downcase != "skill-card.md") | "\(.sha256)  \(.path)"' "$existing" \
              | LC_ALL=C sort > "$RUNNER_TEMP/clawhub-remote.txt"
            (cd "$dir" && find . -type f ! -path '*/.*' -printf '%P\n' | while IFS= read -r f; do
              echo "$(sha256sum < "$f" | cut -d' ' -f1)  $f"
            done) | LC_ALL=C sort > "$RUNNER_TEMP/clawhub-local.txt"
            diff "$RUNNER_TEMP/clawhub-local.txt" "$RUNNER_TEMP/clawhub-remote.txt" \
              || { echo "::error::ClawHub already has $slug@$VERSION, but its files differ from this release."; exit 1; }
            jq -n --arg slug "$slug" --arg version "$VERSION" --arg owner "$CLAWHUB_OWNER" \
              --argjson files "$(wc -l < "$RUNNER_TEMP/clawhub-local.txt")" \
              '{ok: true, status: "already-published", slug: $slug, version: $version, owner: $owner, fileCount: $files}' > "$result"
            echo "::notice::ClawHub already had $slug@$VERSION under @$CLAWHUB_OWNER with identical files; the duplicate-upload error was accepted."
          fi
          { echo "### ClawHub"; echo '```json'; cat "$result"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  skillhub:
    needs: stage
    if: needs.stage.outputs.targets != 'clawhub'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: registry-stage
          path: ${{ runner.temp }}/registry
      - name: Fetch the SkillHub CLI
        env:
          KIT_SHA256: ${{ vars.SKILLHUB_KIT_SHA256 }}
        run: |
          kit="$RUNNER_TEMP/skillhub-kit"
          mkdir -p "$kit"
          curl -fsSL --max-time 60 "$SKILLHUB_KIT_URL" -o "$kit/latest.tar.gz"
          actual="$(sha256sum "$kit/latest.tar.gz" | cut -d' ' -f1)"
          echo "SkillHub kit sha256: $actual"
          if [[ -n "$KIT_SHA256" && "$actual" != "$KIT_SHA256" ]]; then
            echo "::error::SkillHub kit changed (expected $KIT_SHA256). Review it, then update the SKILLHUB_KIT_SHA256 variable."; exit 1
          fi
          tar -xzf "$kit/latest.tar.gz" -C "$kit"
          python3 -c 'import json,sys; print("SkillHub CLI", json.load(open(sys.argv[1]))["version"])' "$kit/cli/version.json"
      - env:
          SKILLHUB_TOKEN: ${{ secrets.SKILLHUB_TOKEN }}
          DRY_RUN: ${{ needs.stage.outputs.dry_run }}
          REQUIRED: ${{ needs.stage.outputs.required }}
          VERSION: ${{ needs.stage.outputs.version }}
          CHANGELOG: ${{ needs.stage.outputs.changelog }}
        run: |
          dir="$RUNNER_TEMP/registry/skillhub/grandet-api-price-finder"
          flags=()
          if [[ "$DRY_RUN" == true ]]; then
            flags+=(--dry-run)
            unset SKILLHUB_TOKEN
          elif [[ -z "$SKILLHUB_TOKEN" ]]; then
            if [[ "$REQUIRED" == true ]]; then echo "::error::SKILLHUB_TOKEN secret is not set."; exit 1; fi
            echo "::warning::SKILLHUB_TOKEN secret is not set; SkillHub was skipped for this release."; exit 0
          fi
          # The CLI reads SKILLHUB_TOKEN from the environment, so the token never appears in argv.
          python3 -E -s "$RUNNER_TEMP/skillhub-kit/cli/skills_store_cli.py" publish "$dir" \
            --host "$SKILLHUB_HOST" --version "$VERSION" --changelog "$CHANGELOG" \
            --json "${flags[@]}" | tee "$RUNNER_TEMP/skillhub-result.json"
          { echo "### SkillHub"; echo '```json'; cat "$RUNNER_TEMP/skillhub-result.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
