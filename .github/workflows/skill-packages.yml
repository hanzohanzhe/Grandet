name: Build immutable Skill candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - run: python3 tests/installation-receipts.test.py
      - run: node scripts/package-price-finder.mjs --out /tmp/grandet-skill-package
      - run: python3 scripts/build-skill-archives.py --package /tmp/grandet-skill-package --out /tmp/grandet-skill-assets
      - uses: actions/upload-artifact@v4
        with:
          name: skill-v0.3.1-${{ github.sha }}
          path: /tmp/grandet-skill-assets
# Publishing is separate: use skill-v0.3.1, upload without overwriting old
# assets, then register actual GitHub IDs/URLs with register-skill-release.py.
