name: Withdraw unaccepted candidate
on:
  push:
    branches: [release/skill-0.3.1]
    paths: [.github/workflows/withdraw-unaccepted-candidate.yml]
permissions:
  contents: write
jobs:
  withdraw:
    if: github.repository == 'hanzohanzhe/Grandet' && github.ref == 'refs/heads/release/skill-0.3.1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Preserve candidate as draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const url='https://api.github.com/repos/hanzohanzhe/Grandet/releases/413142181';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          async function request(method,body){const r=await fetch(url,{method,headers,body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error(method+' HTTP '+r.status);return r.json();}
          const before=await request('GET');
          if(before.id!==413142181||before.tag_name!=='skill-v0.3.1'||before.assets.length!==2||!before.assets.every(a=>[641538455,641538402].includes(a.id)))throw new Error('Candidate identity mismatch');
          const after=await request('PATCH',{draft:true,prerelease:true,name:'Withdrawn candidate — Grandet Skill 0.3.1'});
          if(after.draft!==true||after.id!==before.id)throw new Error('Draft verification failed');
          console.log(JSON.stringify({release_id:after.id,tag:after.tag_name,draft:after.draft,retained_asset_ids:after.assets.map(a=>a.id)}));
          JS
